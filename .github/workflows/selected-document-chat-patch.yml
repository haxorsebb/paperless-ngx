name: Apply selected document chat backend patch

on:
  push:
    branches:
      - feature/paperless-selected-document-chat
    paths:
      - .github/workflows/selected-document-chat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/paperless-selected-document-chat

      - name: Patch chat serializer and view
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/documents/views.py")
          text = path.read_text()

          old_serializer = '''class ChatStreamingSerializer(serializers.Serializer[dict[str, Any]]):
              q = serializers.CharField(required=True, max_length=4000)
              document_id = serializers.IntegerField(required=False, allow_null=True)
          '''

          new_serializer = '''class ChatStreamingSerializer(serializers.Serializer[dict[str, Any]]):
              q = serializers.CharField(required=True, max_length=4000)
              document_id = serializers.IntegerField(required=False, allow_null=True)
              document_ids = serializers.ListField(
                  child=serializers.IntegerField(),
                  required=False,
                  allow_empty=False,
              )

              def validate(self, attrs):
                  if "document_id" in attrs and "document_ids" in attrs:
                      raise serializers.ValidationError(
                          "document_id and document_ids are mutually exclusive",
                      )
                  return attrs
          '''

          if text.count(old_serializer) != 1:
              raise SystemExit("serializer guard failed")
          text = text.replace(old_serializer, new_serializer)

          old_scope = '''        doc_id = serializer.validated_data.get("document_id")

                  if doc_id:
                      try:
                          document = Document.objects.get(id=doc_id)
                      except Document.DoesNotExist:
                          return HttpResponseBadRequest("Document not found")

                      if not has_perms_owner_aware(request.user, "view_document", document):
                          return HttpResponseForbidden("Insufficient permissions")

                      documents = Document.objects.filter(pk=document.pk)
                      unrestricted = False
                  else:
                      documents = Document.objects.filter(
                          id__in=permitted_document_ids(request.user),
                      )
                      unrestricted = user_is_unrestricted(request.user)
          '''

          new_scope = '''        doc_id = serializer.validated_data.get("document_id")
                  document_ids = serializer.validated_data.get("document_ids")

                  if doc_id:
                      try:
                          document = Document.objects.get(id=doc_id)
                      except Document.DoesNotExist:
                          return HttpResponseBadRequest("Document not found")

                      if not has_perms_owner_aware(request.user, "view_document", document):
                          return HttpResponseForbidden("Insufficient permissions")

                      documents = Document.objects.filter(pk=document.pk)
                      unrestricted = False
                  elif document_ids is not None:
                      requested_ids = set(document_ids)
                      documents = Document.objects.filter(pk__in=requested_ids)

                      if documents.count() != len(requested_ids):
                          return HttpResponseBadRequest("Document not found")

                      if documents.exclude(
                          pk__in=permitted_document_ids(request.user),
                      ).exists():
                          return HttpResponseForbidden("Insufficient permissions")

                      unrestricted = False
                  else:
                      documents = Document.objects.filter(
                          id__in=permitted_document_ids(request.user),
                      )
                      unrestricted = user_is_unrestricted(request.user)
          '''

          if text.count(old_scope) != 1:
              raise SystemExit("scope guard failed")
          text = text.replace(old_scope, new_scope)
          path.write_text(text)
          PY

          git diff --check
          git diff -- src/documents/views.py

      - name: Commit backend implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/documents/views.py
          git commit -m "feat: add explicit multi-document chat scope"
          git push origin HEAD:feature/paperless-selected-document-chat
